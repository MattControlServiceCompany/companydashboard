<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CompanyHub Verification Test Runner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        padding: 24px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      .subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .summary {
        display: flex;
        gap: 16px;
        margin: 16px 0;
        font-size: 14px;
        font-weight: 700;
        flex-wrap: wrap;
      }
      .summary span {
        padding: 6px 14px;
        border-radius: 6px;
      }
      .s-pass {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
      }
      .s-fail {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }
      .s-skip {
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
      }
      .s-untested {
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
      }
      .group {
        background: #1e293b;
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .group-header {
        padding: 12px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid #2a3548;
      }
      .group-header:hover {
        background: #253347;
      }
      .group-header .arrow {
        transition: transform 0.2s;
        font-size: 12px;
      }
      .group-header.collapsed .arrow {
        transform: rotate(-90deg);
      }
      .group-title {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
      }
      .group-meta {
        font-size: 12px;
        color: #64748b;
      }
      .group-badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 600;
      }
      .badge-pass {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
      }
      .badge-fail {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }
      .badge-skip {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
      .badge-untested {
        background: rgba(148, 163, 184, 0.2);
        color: #94a3b8;
      }
      .group-body {
        padding: 0 16px 12px;
      }
      .group-body.hidden {
        display: none;
      }
      .test-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid #2a3548;
        font-size: 13px;
      }
      .test-row:last-child {
        border-bottom: none;
      }
      .status {
        min-width: 20px;
        text-align: center;
        font-size: 14px;
      }
      .status-pass {
        color: #22c55e;
      }
      .status-fail {
        color: #ef4444;
      }
      .status-skip {
        color: #f59e0b;
      }
      .status-untested {
        color: #475569;
      }
      .test-id {
        min-width: 60px;
        font-family: monospace;
        font-size: 11px;
        color: #64748b;
      }
      .test-name {
        flex: 1;
      }
      .test-depth {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
      }
      .depth-observe {
        background: rgba(96, 165, 250, 0.15);
        color: #60a5fa;
      }
      .depth-interact {
        background: rgba(168, 85, 247, 0.15);
        color: #a855f7;
      }
      .depth-mutate {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }
      .test-time {
        font-size: 11px;
        color: #475569;
        min-width: 80px;
        text-align: right;
      }
      .test-note {
        font-size: 11px;
        color: #ef4444;
        margin-top: 2px;
        display: block;
      }
      .prereq-bar {
        padding: 8px 16px;
        font-size: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .prereq {
        padding: 3px 10px;
        border-radius: 4px;
      }
      .prereq-met {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
      }
      .prereq-unmet {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }
      button.check-btn {
        background: #3b82f6;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 16px;
      }
      button.check-btn:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>CompanyHub Verification Tests</h1>
    <div class="subtitle">
      Status board for automated Playwright-driven verification. Tests are executed via Playwright MCP sessions.
    </div>
    <button class="check-btn" onclick="checkPrereqs()">Check Prerequisites</button>
    <div class="prereq-bar" id="prereqBar"></div>
    <div class="summary" id="summary"></div>
    <div id="groups"></div>

    <script src="test-verification.js"></script>
    <script>
      const RESULTS_KEY = 'ch_verification_results';
      let results = {};
      try {
        results = JSON.parse(localStorage.getItem(RESULTS_KEY) || '{}');
      } catch (e) {}

      function checkPrereqs() {
        const bar = document.getElementById('prereqBar');
        bar.innerHTML = '';
        for (const [key, desc] of Object.entries(VERIFICATION_TESTS.prerequisites)) {
          const met = PREREQ_CHECKS[key] ? PREREQ_CHECKS[key]() : false;
          const cls = met ? 'prereq-met' : 'prereq-unmet';
          bar.innerHTML += `<span class="prereq ${cls}" title="${desc}">${met ? '✓' : '✗'} ${key}</span>`;
        }
      }

      function getStatus(testId) {
        const r = results[testId];
        if (!r) return 'untested';
        return r.status || 'untested';
      }

      function getTime(testId) {
        const r = results[testId];
        if (!r || !r.timestamp) return '';
        const d = new Date(r.timestamp);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function getNote(testId) {
        const r = results[testId];
        return r?.note || '';
      }

      function statusIcon(status) {
        switch (status) {
          case 'pass':
            return '<span class="status status-pass">✓</span>';
          case 'fail':
            return '<span class="status status-fail">✗</span>';
          case 'skip':
            return '<span class="status status-skip">⊘</span>';
          default:
            return '<span class="status status-untested">○</span>';
        }
      }

      function renderGroups() {
        const container = document.getElementById('groups');
        let totalPass = 0,
          totalFail = 0,
          totalSkip = 0,
          totalUntested = 0;

        for (const group of VERIFICATION_TESTS.groups) {
          let gPass = 0,
            gFail = 0,
            gSkip = 0;
          let testsHtml = '';

          for (const test of group.tests) {
            const status = getStatus(test.id);
            if (status === 'pass') {
              gPass++;
              totalPass++;
            } else if (status === 'fail') {
              gFail++;
              totalFail++;
            } else if (status === 'skip') {
              gSkip++;
              totalSkip++;
            } else {
              totalUntested++;
            }

            const depthCls = `depth-${test.depth}`;
            const note = getNote(test.id);
            testsHtml += `<div class="test-row">
            ${statusIcon(status)}
            <span class="test-id">${test.id}</span>
            <span class="test-name">${test.name}${note ? `<span class="test-note">${note}</span>` : ''}</span>
            <span class="test-depth ${depthCls}">${test.depth}</span>
            <span class="test-time">${getTime(test.id)}</span>
          </div>`;
          }

          const badgeCls = gFail > 0 ? 'badge-fail' : gPass > 0 ? 'badge-pass' : 'badge-untested';
          const badgeText = `${gPass}✓ ${gFail}✗ ${gSkip}⊘`;

          container.innerHTML += `<div class="group">
          <div class="group-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('hidden')">
            <span class="arrow">▼</span>
            <span class="group-title">${group.name}</span>
            <span class="group-meta">${group.page}</span>
            <span class="group-badge ${badgeCls}">${badgeText}</span>
          </div>
          <div class="group-body">${testsHtml}</div>
        </div>`;
        }

        document.getElementById('summary').innerHTML =
          `<span class="s-pass">${totalPass} passed</span>` +
          `<span class="s-fail">${totalFail} failed</span>` +
          `<span class="s-skip">${totalSkip} skipped</span>` +
          `<span class="s-untested">${totalUntested} untested</span>`;
      }

      checkPrereqs();
      renderGroups();
    </script>
  </body>
</html>
