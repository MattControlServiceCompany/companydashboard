<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Savings Portal — Control Service Company</title>
    <style>
      /* ── Reset & base ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 16px;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      .portal-header {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .portal-header .logo-badge {
        background: #238636;
        color: #fff;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0.5px;
        padding: 6px 12px;
        border-radius: 6px;
        flex-shrink: 0;
      }
      .portal-header .hdr-text {
        flex: 1;
        min-width: 0;
      }
      .portal-header .hdr-title {
        font-size: 18px;
        font-weight: 700;
        color: #e6edf3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .portal-header .hdr-sub {
        font-size: 12px;
        color: #8b949e;
        margin-top: 2px;
      }

      /* ── Main content ── */
      .portal-main {
        flex: 1;
        padding: 28px 20px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
      }

      /* ── KPI cards ── */
      .kpi-grid {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .kpi-card {
        flex: 1 1 220px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 20px;
        min-width: 0;
      }
      .kpi-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #8b949e;
        margin-bottom: 10px;
      }
      .kpi-value {
        font-size: 32px;
        font-weight: 800;
        color: #3fb950;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .kpi-value.neutral {
        color: #e6edf3;
      }
      .kpi-sub {
        font-size: 12px;
        color: #8b949e;
        margin-top: 6px;
      }

      /* ── Progress bar ── */
      .progress-bar-track {
        background: #21262d;
        border-radius: 4px;
        height: 8px;
        overflow: hidden;
        margin: 10px 0 6px;
      }
      .progress-bar-fill {
        height: 100%;
        background: #3fb950;
        border-radius: 4px;
        transition: width 0.4s ease;
      }

      /* ── Section titles ── */
      .section-title {
        font-size: 14px;
        font-weight: 700;
        color: #c9d1d9;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #21262d;
      }

      /* ── Chart card ── */
      .chart-card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 28px;
        overflow-x: auto;
      }
      .chart-card svg {
        display: block;
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
      }

      /* ── Error / loading states ── */
      .state-box {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 48px 24px;
        text-align: center;
        color: #8b949e;
      }
      .state-box .state-icon {
        font-size: 40px;
        margin-bottom: 16px;
      }
      .state-box .state-title {
        font-size: 18px;
        font-weight: 700;
        color: #c9d1d9;
        margin-bottom: 8px;
      }
      .state-box .state-msg {
        font-size: 14px;
        line-height: 1.6;
      }

      /* ── Footer ── */
      .portal-footer {
        background: #161b22;
        border-top: 1px solid #30363d;
        padding: 16px 24px;
        text-align: center;
        font-size: 12px;
        color: #6e7681;
      }
      .portal-footer a {
        color: #58a6ff;
        text-decoration: none;
      }
      .portal-footer a:hover {
        text-decoration: underline;
      }

      /* ── Print styles ── */
      @media print {
        body {
          background: #fff;
          color: #000;
        }
        .portal-header {
          background: #fff;
          border-bottom: 1px solid #ccc;
        }
        .portal-header .logo-badge {
          background: #2d7a40;
        }
        .kpi-card,
        .chart-card {
          background: #fff;
          border: 1px solid #ccc;
          break-inside: avoid;
        }
        .kpi-value {
          color: #2d7a40;
        }
        .portal-footer {
          border-top: 1px solid #ccc;
          background: #fff;
          color: #555;
        }
      }

      /* ── Mobile ── */
      @media (max-width: 600px) {
        .portal-header {
          padding: 14px 16px;
        }
        .portal-header .hdr-title {
          font-size: 15px;
        }
        .portal-main {
          padding: 20px 12px;
        }
        .kpi-value {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="portal-header">
      <div class="logo-badge">CSC</div>
      <div class="hdr-text">
        <div class="hdr-title" id="hdr-title">Energy Savings Portal</div>
        <div class="hdr-sub" id="hdr-sub">Control Service Company</div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="portal-main" id="portal-main">
      <!-- Loading state shown until data loads -->
      <div class="state-box" id="loading-state">
        <div class="state-icon">&#x23F3;</div>
        <div class="state-title">Loading portal data&hellip;</div>
        <div class="state-msg">Please wait while we fetch your energy savings report.</div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="portal-footer" id="portal-footer">
      Powered by <strong>Control Service Company</strong> &mdash; Energy Services
    </footer>

    <script>
      // ── Helpers ──────────────────────────────────────────────────
      function fmt$(n) {
        if (n == null || isNaN(n)) return '—';
        return '$' + Math.round(n).toLocaleString('en-US');
      }
      function fmtNum(n, decimals) {
        if (n == null || isNaN(n)) return '—';
        return Number(n).toLocaleString('en-US', { maximumFractionDigits: decimals || 0 });
      }
      function fmtPct(n) {
        if (n == null || isNaN(n)) return '—';
        return Math.round(n) + '%';
      }

      // ── URL token parsing ─────────────────────────────────────────
      function getToken() {
        const params = new URLSearchParams(window.location.search);
        return params.get('p');
      }

      // ── SVG bar chart ─────────────────────────────────────────────
      function buildBarChart(monthly) {
        if (!monthly || !monthly.length)
          return '<p style="color:#8b949e;text-align:center;padding:24px">No monthly data available.</p>';

        const W = 820,
          H = 180;
        const padL = 64,
          padR = 16,
          padT = 16,
          padB = 40;
        const chartW = W - padL - padR;
        const chartH = H - padT - padB;

        const vals = monthly.map((m) => m.savingsDollars || 0);
        const maxVal = Math.max(...vals, 1);

        // Nice y-axis max
        function niceMax(v) {
          const mag = Math.pow(10, Math.floor(Math.log10(v)));
          return Math.ceil(v / mag) * mag;
        }
        const yMax = niceMax(maxVal * 1.15);

        const n = monthly.length;
        const barW = Math.min(36, (chartW / n) * 0.6);
        const step = chartW / n;

        // Y-axis gridlines (4 ticks)
        const ticks = [0, 0.25, 0.5, 0.75, 1.0].map((f) => yMax * f);
        const gridLines = ticks
          .map((t) => {
            const y = padT + chartH - (t / yMax) * chartH;
            const label = t >= 1000 ? '$' + Math.round(t / 1000) + 'k' : '$' + Math.round(t);
            return `
      <line x1="${padL}" y1="${y}" x2="${padL + chartW}" y2="${y}" stroke="#21262d" stroke-width="1"/>
      <text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#6e7681">${label}</text>`;
          })
          .join('');

        // Bars and labels
        const bars = monthly
          .map((m, i) => {
            const v = m.savingsDollars || 0;
            const barH = Math.max(2, (v / yMax) * chartH);
            const x = padL + i * step + (step - barW) / 2;
            const y = padT + chartH - barH;
            const label = m.label || m.month || '';
            const short = label.replace(/\s+\d{4}$/, '').slice(0, 3); // "Jun 2025" → "Jun"
            const valLabel = v > 0 ? (v >= 1000 ? '$' + Math.round(v / 1000) + 'k' : '$' + Math.round(v)) : '';
            return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${barH.toFixed(1)}"
            rx="3" fill="#238636" opacity="0.9"/>
      <text x="${(x + barW / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle"
            font-size="9" fill="#3fb950">${valLabel}</text>
      <text x="${(x + barW / 2).toFixed(1)}" y="${(padT + chartH + 14).toFixed(1)}" text-anchor="middle"
            font-size="10" fill="#8b949e">${short}</text>`;
          })
          .join('');

        return `<svg viewBox="0 0 ${W} ${H}" aria-label="Monthly savings bar chart">
    <!-- Grid -->
    ${gridLines}
    <!-- X axis -->
    <line x1="${padL}" y1="${padT + chartH}" x2="${padL + chartW}" y2="${padT + chartH}"
          stroke="#30363d" stroke-width="1"/>
    <!-- Bars -->
    ${bars}
  </svg>`;
      }

      // ── Render portal ─────────────────────────────────────────────
      function renderPortal(data) {
        const main = document.getElementById('portal-main');

        // Update header
        const projectName = (data.meta && data.meta.projectName) || data.clientName || 'Client Portal';
        const publishedAt = (data.meta && data.meta.publishedAt) || data.generatedAt || '';
        const periodLabel = (data.meta && data.meta.reportingPeriodLabel) || data.period || '';
        document.getElementById('hdr-title').textContent = projectName + ' — Energy Savings Portal';
        document.getElementById('hdr-sub').textContent =
          'Control Service Company' +
          (publishedAt
            ? ' · Last updated: ' +
              new Date(publishedAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
            : '');

        // Summary values
        const summary = data.summary || {};
        const contract = data.contract || {};
        const meta = data.meta || {};

        const totalSavings = summary.totalSavingsDollars ?? data.totalSavings ?? 0;
        const annualTarget = summary.annualTargetDollars ?? contract.annualTarget ?? 0;
        const contractPct =
          summary.contractProgressPct != null
            ? summary.contractProgressPct
            : annualTarget > 0
              ? Math.min(100, (totalSavings / annualTarget) * 100)
              : null;
        const currentYear = meta.currentContractYear ?? contract.currentYear ?? null;
        const totalYears = meta.contractYears ?? contract.totalYears ?? null;
        const co2Lbs = summary.co2AvoidedLbs ?? (data.co2 && data.co2.lbsAvoided) ?? 0;
        const treesEquiv = summary.treesEquivalent ?? (data.co2 && data.co2.treesEquiv) ?? 0;
        const carsEquiv = summary.carsRemovedEquivalent ?? (data.co2 && data.co2.carsRemoved) ?? 0;

        // KPI 1: Contract Progress
        const yearLabel =
          currentYear && totalYears ? `Year ${currentYear} of ${totalYears}` : periodLabel || 'Contract Progress';
        const progressBarPct = contractPct != null ? Math.min(100, Math.max(0, contractPct)) : 0;
        const targetDisplay = annualTarget > 0 ? `Annual target: ${fmt$(annualTarget)}` : '';

        // KPI 2: Total Savings
        // KPI 3: CO2 Impact

        const monthly = data.monthly || [];

        main.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Contract Progress</div>
        <div class="kpi-value neutral" id="kpi-year">${yearLabel}</div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" style="width:${progressBarPct.toFixed(1)}%"></div>
        </div>
        <div class="kpi-sub">${contractPct != null ? fmtPct(contractPct) + ' of target achieved' : ''}${targetDisplay ? ' &bull; ' + targetDisplay : ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Savings</div>
        <div class="kpi-value">${fmt$(totalSavings)}</div>
        <div class="kpi-sub">${annualTarget > 0 ? 'Target: ' + fmt$(annualTarget) : 'Cost avoided this period'}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">CO<sub>2</sub> Impact</div>
        <div class="kpi-value neutral">${fmtNum(co2Lbs)} <span style="font-size:16px;color:#8b949e">lbs</span></div>
        <div class="kpi-sub">
          ${treesEquiv > 0 ? '&#x1F333; ' + fmtNum(treesEquiv) + ' trees equiv.' : ''}
          ${carsEquiv > 0 ? ' &bull; &#x1F697; ' + fmtNum(carsEquiv) + ' cars off road' : ''}
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="section-title">Monthly Savings${periodLabel ? ' — ' + periodLabel : ''}</div>
      ${buildBarChart(monthly)}
    </div>
  `;
      }

      // ── Error display ─────────────────────────────────────────────
      function renderError(title, msg) {
        const main = document.getElementById('portal-main');
        main.innerHTML = `
    <div class="state-box">
      <div class="state-icon">&#x26A0;&#xFE0F;</div>
      <div class="state-title">${title}</div>
      <div class="state-msg">${msg}</div>
    </div>`;
      }

      // ── Main: load data ───────────────────────────────────────────
      (function main() {
        const token = getToken();

        if (!token) {
          document.getElementById('loading-state').style.display = 'none';
          renderError(
            'No portal token',
            'This URL is missing a portal token (<code>?p=…</code>). ' +
              'Please use the link provided by Control Service Company.',
          );
          return;
        }

        // Validate token is UUID-shaped (basic check — not security, just UX)
        const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        if (!uuidRe.test(token)) {
          document.getElementById('loading-state').style.display = 'none';
          renderError(
            'Invalid portal token',
            'The portal token in this URL does not appear to be valid. ' +
              'Please check the link and try again, or contact Control Service Company.',
          );
          return;
        }

        // Fetch the JSON data file relative to this page's origin
        const dataUrl = '../portal-data/' + token + '.json';

        fetch(dataUrl)
          .then(function (res) {
            if (!res.ok) {
              if (res.status === 404) {
                throw new Error('not_found');
              }
              throw new Error('http_' + res.status);
            }
            return res.json();
          })
          .then(function (data) {
            renderPortal(data);
          })
          .catch(function (err) {
            const isNotFound = err.message === 'not_found';
            renderError(
              isNotFound ? 'Portal data not found' : 'Could not load portal data',
              isNotFound
                ? 'This portal link has not been published yet, or the link may be outdated. ' +
                    'Please contact Control Service Company for an updated link.'
                : 'An error occurred while loading the portal data. Please try again later, ' +
                    'or contact Control Service Company if the problem persists.<br>' +
                    '<small style="color:#6e7681">Error: ' +
                    (err.message || 'Unknown') +
                    '</small>',
            );
          });
      })();
    </script>
  </body>
</html>
