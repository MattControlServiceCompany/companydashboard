<!doctype html>
<html lang="en">
  <script>
    (function () {
      try {
        const t = localStorage.getItem('ch_theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://rrdugvwxtddjywqykphf.supabase.co https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>CompanyHub — Sign In</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%23238636'/><text x='50' y='72' font-size='60' font-weight='bold' text-anchor='middle' fill='white'>C</text></svg>"
    />
    <script src="app/ch-auth.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style id="site-ui-styles">
      /* ═══════════════════════════════════════════════════
         SITE-UI.CSS — Shared CompanyHub UI Shell
         Topbar, sidebar, dept-nav, settings, theming
      ═══════════════════════════════════════════════════ */

      /* ── THEME TOKENS ── */
      :root {
        --bg: #060810;
        --s1: #0c0f1a;
        --s2: #181d2e;
        --s3: #1e2438;
        --s4: #252c42;
        --border: #2a3555;
        --border2: #354165;
        --accent: #3b82f6;
        --accent-dim: rgba(59, 130, 246, 0.12);
        --accent-glow: rgba(59, 130, 246, 0.25);
        --teal: #14b8a6;
        --teal-dim: rgba(20, 184, 166, 0.1);
        --amber: #f59e0b;
        --amber-dim: rgba(245, 158, 11, 0.12);
        --red: #f43f5e;
        --red-dim: rgba(244, 63, 94, 0.1);
        --violet: #8b5cf6;
        --violet-dim: rgba(139, 92, 246, 0.1);
        --green: #22c55e;
        --orange: #fb923c;
        --em: #00d4aa;
        --em-dim: rgba(0, 212, 170, 0.1);
        --text: #e2e8f8;
        --text2: #9fb3d4;
        --text3: #6b7a9e;
        --font: 'Outfit', sans-serif;
        --mono: 'JetBrains Mono', monospace;
        --r: 10px;
      }

      /* ── RESET ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        height: 100%;
        min-width: 900px;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--s1);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 3px;
      }

      /* ── ANIMATIONS ── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── LOGIN ── */
      #loginScreen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #loginScreen::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.35;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 100%);
      }
      .login-card {
        position: relative;
        z-index: 1;
        background: var(--s2);
        border: 1px solid var(--border2);
        border-radius: 18px;
        padding: 44px 48px;
        width: 400px;
        max-width: 95vw;
        text-align: center;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
        animation: fadeUp 0.5s ease;
      }
      .login-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        margin-bottom: 28px;
      }
      .login-mark {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--teal));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        font-weight: 800;
        color: #fff;
      }
      .login-brand {
        font-size: 20px;
        font-weight: 800;
      }
      .login-sub {
        font-size: 12px;
        color: var(--text2);
        margin-bottom: 30px;
        line-height: 1.6;
      }
      .btn-ms {
        width: 100%;
        padding: 12px 20px;
        border-radius: 9px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-family: var(--font);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.2s;
      }
      .btn-ms:hover {
        filter: brightness(1.15);
        transform: translateY(-2px);
      }
      .login-input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 9px;
        border: 1px solid var(--border2);
        background: var(--s2);
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      .login-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .login-error {
        font-size: 12px;
        color: var(--red);
        margin: -2px 0 10px;
        line-height: 1.5;
      }
      .login-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
      }
      .login-divider::before,
      .login-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .login-divider span {
        font-size: 11px;
        color: var(--text3);
      }
      .btn-demo {
        width: 100%;
        padding: 10px;
        border-radius: 9px;
        border: 1px solid var(--border2);
        background: transparent;
        color: var(--text2);
        font-family: var(--font);
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-demo:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .login-note {
        font-size: 11px;
        color: var(--text3);
        margin-top: 18px;
        line-height: 1.7;
      }
      .login-note a {
        color: var(--accent);
        text-decoration: none;
      }

      /* ── APP ── */
      #app {
        display: none;
      }
      #app.visible {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        animation: fadeUp 0.4s ease;
      }

      /* ── TOPBAR ── */
      .topbar {
        flex-shrink: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 0 24px;
        background: rgba(12, 15, 26, 0.95);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
      }
      .t-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--accent), var(--teal));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
      }
      .brand-name {
        font-size: 16px;
        font-weight: 800;
      }
      .t-right {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .help-btn {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--s1);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text2);
        font-size: 14px;
        font-weight: 700;
        transition: all 0.15s;
        font-family: var(--font);
      }
      .help-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .user-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--s1);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
      }
      .u-av {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: linear-gradient(135deg, var(--accent), var(--teal));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        color: #fff;
      }
      .u-name {
        font-size: 12px;
        font-weight: 500;
      }
      .u-dept {
        font-size: 10px;
        color: var(--text2);
      }
      .sync-btn {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: var(--font);
        font-size: 12px;
        font-weight: 500;
        color: var(--text2);
        background: var(--s1);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        transition: all 0.18s;
      }
      .sync-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .ms-sq {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        width: 11px;
      }
      .ms-sq span {
        display: block;
        width: 4.5px;
        height: 4.5px;
        border-radius: 1px;
      }
      .ms-sq span:nth-child(1) {
        background: #f25022;
      }
      .ms-sq span:nth-child(2) {
        background: #7fba00;
      }
      .ms-sq span:nth-child(3) {
        background: #00a4ef;
      }
      .ms-sq span:nth-child(4) {
        background: #ffb900;
      }
      .icon-btn {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--s1);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text2);
        font-size: 15px;
        transition: all 0.15s;
      }
      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .npip {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--red);
        border: 1px solid var(--bg);
      }
      .signout {
        font-family: var(--font);
        font-size: 12px;
        color: var(--text2);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        transition: all 0.18s;
      }
      .signout:hover {
        border-color: var(--red);
        color: var(--red);
      }

      /* ── DEPT TABS ── */
      .dept-nav {
        flex-shrink: 0;
        background: var(--s1);
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        display: flex;
        overflow-x: auto;
      }
      .dept-tab {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text2);
        cursor: pointer;
        border: none;
        background: none;
        border-bottom: 2px solid transparent;
        transition: all 0.16s;
        white-space: nowrap;
        font-family: var(--font);
        text-decoration: none;
      }
      .dept-tab:hover {
        color: var(--text);
        text-decoration: none;
      }
      .dept-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
        text-decoration: none;
      }

      /* ── SIDEBAR LAYOUT ── */
      .app-wrap {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .sidebar {
        width: 220px;
        flex-shrink: 0;
        background: var(--s1);
        border-right: 1px solid var(--border);
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .sidebar-top {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        padding: 14px 0;
      }
      .sidebar-bottom {
        padding: 10px 12px 14px;
        flex-shrink: 0;
      }
      .s-sect {
        margin-bottom: 22px;
      }
      .s-lbl {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        color: var(--text2);
        text-transform: uppercase;
        padding: 0 16px;
        margin-bottom: 6px;
      }
      .s-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        font-size: 14px;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.14s;
        border-left: 2px solid transparent;
        text-decoration: none;
        background: none;
        border-top: none;
        border-right: none;
        border-bottom: none;
        width: 100%;
        text-align: left;
        font-family: var(--font);
      }
      .s-item:hover {
        color: var(--text);
        background: var(--s1);
        text-decoration: none;
      }
      .s-item.active {
        color: var(--accent);
        background: var(--accent-dim);
        border-left-color: var(--accent);
        font-weight: 500;
        text-decoration: none;
      }
      .s-ico {
        font-size: 14px;
        width: 18px;
        text-align: center;
      }
      .s-badge {
        margin-left: auto;
        font-size: 10px;
        font-family: var(--mono);
        background: var(--accent);
        color: #fff;
        border-radius: 9px;
        padding: 1px 6px;
      }

      /* ── SIDEBAR BOTTOM WIDGETS ── */
      .sb-settings-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--s1);
        color: var(--text2);
        font-family: var(--font);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
      }
      .sb-settings-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sb-divider {
        height: 1px;
        background: var(--border);
        margin: 10px 0;
      }
      .sb-clock {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
        margin-bottom: 2px;
      }
      .sb-date {
        font-size: 11px;
        color: var(--text2);
        line-height: 1.4;
        margin-bottom: 10px;
      }
      .sb-btn-row {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }
      .sb-btn {
        flex: 1;
        padding: 6px 0;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--s1);
        color: var(--text2);
        font-family: var(--font);
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
      }
      .sb-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sb-btn.danger:hover {
        border-color: var(--red);
        color: var(--red);
      }

      /* ── CONTENT ── */
      /* Container must NOT scroll — .tab-panel.active owns the scroll */
      .content {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .tab-panel {
        display: none;
        animation: fadeUp 0.26s ease;
      }
      .tab-panel.active {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 24px 26px;
      }

      /* ── PAGE HEADER ── */
      .pg-hdr {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .pg-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .pg-title em {
        color: var(--accent);
        font-style: normal;
      }
      .pg-sub {
        font-size: 13px;
        color: var(--text2);
        margin-top: 4px;
      }

      /* ── TOAST ── */
      .toast {
        position: fixed;
        top: 22px;
        left: 50%;
        transform: translateX(-50%) translateY(-80px);
        z-index: 9999;
        background: var(--s3);
        border: 1px solid var(--accent);
        border-radius: 10px;
        padding: 11px 15px;
        font-size: 12px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 320px;
        opacity: 0;
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }
      .toast-show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      .t-ic {
        color: var(--teal);
        font-size: 14px;
      }
      /* Loud, persistent variant for backup/restore PDF failures — no
         auto-hide timer, must be dismissed explicitly (see _pdfNotice). */
      .toast-error {
        border-color: var(--red);
        max-width: 420px;
        align-items: flex-start;
      }
      .toast-error .t-ic {
        color: var(--red);
      }
      #toastMsg {
        flex: 1;
        min-width: 0;
      }
      .toast-x {
        background: none;
        border: none;
        color: inherit;
        font-size: 14px;
        cursor: pointer;
        margin-left: 4px;
        opacity: 0.7;
        padding: 0;
        line-height: 1;
        flex-shrink: 0;
      }
      .toast-x:hover {
        opacity: 1;
      }

      /* ── SETTINGS MODAL ── */
      .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(6, 8, 16, 0.88);
        backdrop-filter: blur(10px);
        z-index: 800;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .settings-overlay.open {
        display: flex;
      }
      .settings-modal {
        background: var(--s2);
        border: 1px solid var(--border2);
        border-radius: 14px;
        width: 480px;
        max-width: 95vw;
        max-height: 90vh;
        overflow: hidden; /* outer MUST NOT scroll — only .settings-body scrolls */
        display: flex;
        flex-direction: column;
        animation: fadeUp 0.18s ease;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
      }
      .settings-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0; /* pinned — never scrolls away */
      }
      .settings-title {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .settings-x {
        width: 27px;
        height: 27px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        transition: all 0.13s;
        font-family: var(--font);
      }
      .settings-x:hover {
        border-color: var(--red);
        color: var(--red);
      }
      .settings-body {
        padding: 20px;
        flex: 1;
        min-height: 0;
        overflow-y: auto; /* sole scroll region for settings modal */
      }
      .settings-section {
        margin-bottom: 20px;
      }
      .settings-section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.7px;
        margin-bottom: 10px;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--s3);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .settings-row-label {
        font-size: 13px;
        font-weight: 500;
      }
      .settings-row-sub {
        font-size: 11px;
        color: var(--text2);
        margin-top: 2px;
      }
      .settings-select {
        font-family: var(--font);
        font-size: 12px;
        color: var(--text);
        background: var(--s4);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 5px 8px;
        outline: none;
        cursor: pointer;
      }
      .settings-select option {
        background: var(--s2);
      }

      /* Color Swatches */
      .color-swatches {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .color-swatch {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 2px solid transparent;
        cursor: pointer;
        transition: all 0.15s;
        position: relative;
      }
      .color-swatch:hover {
        transform: scale(1.15);
      }
      .color-swatch.active {
        border-color: #fff;
        box-shadow: 0 0 0 2px var(--accent);
      }
      .color-swatch.active::after {
        content: '';
        position: absolute;
        inset: 3px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      /* Custom color input */
      .custom-color-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .custom-color-input {
        width: 32px;
        height: 28px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background: transparent;
        padding: 0;
      }
      .custom-color-input::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .custom-color-input::-webkit-color-swatch {
        border-radius: 5px;
        border: 1px solid var(--border2);
      }
      .custom-color-label {
        font-size: 11px;
        color: var(--text2);
      }

      /* Help Modal */
      .help-overlay {
        position: fixed;
        inset: 0;
        background: rgba(6, 8, 16, 0.88);
        backdrop-filter: blur(10px);
        z-index: 800;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .help-overlay.open {
        display: flex;
      }
      .help-modal {
        background: var(--s2);
        border: 1px solid var(--border2);
        border-radius: 14px;
        width: 500px;
        max-width: 95vw;
        max-height: 90vh;
        overflow: hidden; /* outer MUST NOT scroll — only .help-body scrolls */
        display: flex;
        flex-direction: column;
        animation: fadeUp 0.18s ease;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
      }
      .help-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0; /* pinned — never scrolls away */
      }
      .help-title {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .help-x {
        width: 27px;
        height: 27px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        transition: all 0.13s;
        font-family: var(--font);
      }
      .help-x:hover {
        border-color: var(--red);
        color: var(--red);
      }
      .help-body {
        padding: 20px;
        flex: 1;
        min-height: 0;
        overflow-y: auto; /* sole scroll region for help modal */
      }
      .help-item {
        padding: 10px 12px;
        background: var(--s3);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .help-item-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .help-item-desc {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.6;
      }

      /* ── THEME PILLS (Settings Modal) ── */
      .theme-pills {
        display: flex;
        gap: 6px;
      }
      .theme-pill {
        font-family: var(--font);
        font-size: 12px;
        font-weight: 500;
        padding: 6px 14px;
        border-radius: 7px;
        border: 1px solid var(--border2);
        background: var(--s4);
        color: var(--text2);
        cursor: pointer;
        transition: all 0.15s;
      }
      .theme-pill:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .theme-pill.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      /* ── LIGHT MODE THEME ── */
      [data-theme='light'] {
        --bg: #f0f2f7;
        --s1: #e4e8f2;
        --s2: #ffffff;
        --s3: #f5f7fc;
        --s4: #eaedf6;
        --border: #d3d9e8;
        --border2: #bcc5da;
        --text: #1a2340;
        --text2: #4a5672;
        --text3: #526080;
        --em: #007a8c;
        --em-dim: rgba(0, 122, 140, 0.1);
        --em-glow: rgba(0, 122, 140, 0.2);
        --em2: #0369a1;
        --em2-dim: rgba(3, 105, 161, 0.1);
        --warn: #b45309;
        --warn-dim: rgba(180, 83, 9, 0.1);
        --danger: #be123c;
        --danger-dim: rgba(190, 18, 60, 0.1);
        --violet: #6d28d9;
        --violet-dim: rgba(109, 40, 217, 0.1);
        --accent: var(--em);
      }
      [data-theme='light'] body {
        background: var(--bg);
        color: var(--text);
      }
      [data-theme='light'] .topbar {
        background: rgba(240, 242, 247, 0.97);
        border-bottom-color: var(--border);
      }
      [data-theme='light'] .dept-nav {
        background: var(--s1);
        border-bottom-color: var(--border);
      }
      [data-theme='light'] .theme-pill.active {
        color: #fff;
      }
      [data-theme='light'] .modal {
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      }
      [data-theme='light'] .settings-modal,
      [data-theme='light'] .help-modal {
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      }
      /* ── Feedback Mode Toggle ── */
      .settings-toggle {
        position: relative;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
      }
      .settings-toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .settings-toggle .toggle-track {
        position: absolute;
        inset: 0;
        background: var(--s2);
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .settings-toggle input:checked + .toggle-track {
        background: var(--accent);
      }
      .settings-toggle .toggle-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .settings-toggle input:checked ~ .toggle-knob {
        transform: translateX(20px);
      }

      /* [COMMENTED OUT] Media query for sync button — no longer needed
      @media (max-width: 1024px) {
        .sync-btn {
          display: none;
        }
      }
      */
    </style>

    <link rel="stylesheet" href="feedback-widget.css?v=775" />
  </head>
  <body>
    <!-- LOGIN -->
    <div id="loginScreen">
      <div class="login-card">
        <div class="login-logo">
          <div class="login-mark">C</div>
          <span class="login-brand">CompanyHub</span>
        </div>
        <p class="login-sub">Sign in with your CompanyHub email and password to access all departments and tools.</p>
        <form id="loginForm" onsubmit="return loginWithPassword(event);">
          <input
            class="login-input"
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Email"
            autocomplete="username"
            required
          />
          <input
            class="login-input"
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <p class="login-error" id="loginError" style="display: none"></p>
          <button class="btn-ms" id="loginSubmitBtn" type="submit">Sign In</button>
        </form>
        <div class="login-divider"><span>or</span></div>
        <button class="btn-demo" onclick="loginDemo()">Continue in Demo Mode</button>
        <p class="login-note">Sign-in is verified by CompanyHub's backend — your password is never stored locally.</p>
      </div>
    </div>

    <script>
      /* ── AUTH ──
         Email + password sign-in via Supabase Auth (window.CH_AUTH, loaded
         from app/ch-auth.js). Replaces the former Microsoft 365/MSAL flow —
         removed entirely, no fallback. */
      let currentUser = null;

      function saveSession(u) {
        sessionStorage.setItem('ch_user', JSON.stringify(u));
        localStorage.setItem('ch_user', JSON.stringify(u));
      }
      function loadSession() {
        try {
          const s = sessionStorage.getItem('ch_user') || localStorage.getItem('ch_user');
          return s ? JSON.parse(s) : null;
        } catch (e) {
          return null;
        }
      }
      function clearSession() {
        sessionStorage.removeItem('ch_user');
        localStorage.removeItem('ch_user');
      }

      function loginDemo() {
        currentUser = { name: 'Demo User', email: 'demo@controlservice.com', initials: 'DU', isReal: false };
        saveSession(currentUser);
        enterApp();
      }

      function _initialsFromEmail(email) {
        const local = (email || '?').split('@')[0];
        const parts = local.split(/[._-]+/).filter(Boolean);
        if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
        return local.slice(0, 2).toUpperCase();
      }

      async function loginWithPassword(evt) {
        if (evt) evt.preventDefault();
        const btn = document.getElementById('loginSubmitBtn');
        const errEl = document.getElementById('loginError');
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        errEl.style.display = 'none';
        btn.textContent = 'Signing in...';
        btn.disabled = true;
        try {
          if (!window.CH_AUTH || typeof window.CH_AUTH.signIn !== 'function') {
            throw new Error('Sign-in is unavailable — auth module failed to load.');
          }
          const r = await window.CH_AUTH.signIn(email, password);
          currentUser = {
            name: r.email || email,
            email: r.email || email,
            initials: _initialsFromEmail(r.email || email),
            isReal: true,
          };
          saveSession(currentUser);
          enterApp();
        } catch (e) {
          errEl.textContent = (e && e.message) || 'Sign-in failed. Check your email and password.';
          errEl.style.display = 'block';
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
        return false;
      }

      /* CompanyHub is Energy Department only — no Home hub to land on, so a
         successful sign-in goes straight to energy-department.html instead of
         unhiding a local #app shell. (feature/energy-dept-only, 2026-08-24) */
      function enterApp() {
        window.location.href = 'energy-department.html';
      }

      // Auto-login if session exists
      (function () {
        const u = loadSession();
        if (u) {
          currentUser = u;
          enterApp();
        }
      })();
    </script>

    <script id="site-fns">
      /* ══ SITE FUNCTIONS ══ */

      /* Theme */
      function siteApplyTheme(mode) {
        var isLight = mode === 'light';
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
        try {
          localStorage.setItem('ch_theme', isLight ? 'light' : 'dark');
        } catch (e) {}
        document.querySelectorAll('.theme-pill').forEach(function (p) {
          p.classList.toggle('active', p.getAttribute('data-theme') === (isLight ? 'light' : 'dark'));
        });
        // save to settings
        try {
          var s = JSON.parse(localStorage.getItem('ch_settings') || '{}');
          s.theme = isLight ? 'light' : 'dark';
          localStorage.setItem('ch_settings', JSON.stringify(s));
        } catch (e) {}
      }

      /* Accent color */
      function siteApplyAccent(hex) {
        var r = parseInt(hex.slice(1, 3), 16),
          g = parseInt(hex.slice(3, 5), 16),
          b = parseInt(hex.slice(5, 7), 16);
        var root = document.documentElement;
        root.style.setProperty('--accent', hex);
        root.style.setProperty('--accent-dim', 'rgba(' + r + ',' + g + ',' + b + ',0.12)');
        root.style.setProperty('--accent-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.25)');
        root.style.setProperty('--em', hex);
        root.style.setProperty('--em-dim', 'rgba(' + r + ',' + g + ',' + b + ',0.1)');
        root.style.setProperty('--em-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.22)');
        try {
          var s = JSON.parse(localStorage.getItem('ch_settings') || '{}');
          s.accentColor = hex;
          localStorage.setItem('ch_settings', JSON.stringify(s));
        } catch (e) {}
      }

      /* Init saved theme/accent on load. This page (login screen only, no
         Home hub) has no settings modal to configure them from -- that lives
         on energy-department.html now. (feature/energy-dept-only, 2026-08-24) */
      document.addEventListener('DOMContentLoaded', function () {
        try {
          var s = JSON.parse(localStorage.getItem('ch_settings') || '{}');
          if (s.accentColor) siteApplyAccent(s.accentColor);
          var theme = s.theme || localStorage.getItem('ch_theme') || 'dark';
          siteApplyTheme(theme);
        } catch (e) {}
      });
    </script>
    <script src="app/sync-classification.js?v=775"></script>
    <script src="app/db.js?v=775"></script>
    <script src="app/sync-ui.js?v=775"></script>

    <script src="feedback-widget.js?v=775"></script>
  </body>
</html>
