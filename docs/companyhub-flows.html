<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompanyHub - Architecture and Flows</title>
<style>
:root {
  --bg: #0a0e18;
  --s1: #0f1422;
  --s2: #141a2c;
  --s3: #1a2138;
  --border: #1e2740;
  --border2: #2a3455;
  --accent: #e8a825;
  --accent-dim: rgba(232,168,37,0.12);
  --accent-border: rgba(232,168,37,0.5);
  --blue: #3b82f6;
  --teal: #14b8a6;
  --violet: #8b5cf6;
  --rose: #f43f5e;
  --green: #22c55e;
  --amber: #f59e0b;
  --sky: #38bdf8;
  --text: #e2e8f8;
  --text2: #7b8baa;
  --text3: #3e4a66;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'SF Mono', 'Consolas', monospace;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--s1); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.page { display: flex; flex-direction: column; height: 100vh; }
.hdr {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.hdr h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.02em; }
.hdr p { font-size: 13px; color: var(--text2); max-width: 700px; line-height: 1.5; }
.legend { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; }

.body { display: flex; flex: 1; overflow: hidden; }

.diagram-wrap { flex: 1; overflow: auto; padding: 24px 20px 40px; position: relative; }
.diagram { display: grid; grid-template-columns: repeat(6, 160px); gap: 14px 20px; min-width: 1060px; position: relative; }
svg.connectors { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; overflow: visible; }
svg.connectors line { stroke: var(--accent); stroke-width: 2; opacity: 0.7; }
svg.connectors circle { fill: var(--accent); }
svg.connectors text { fill: var(--bg); font-size: 9px; font-weight: 800; font-family: var(--font); text-anchor: middle; dominant-baseline: central; }
.col-label {
  font-size: 10px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--text3);
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}

.box {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  transition: all .2s;
  position: relative;
}
.box .name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.box .detail { font-size: 10px; color: var(--text3); line-height: 1.4; }
.box.highlight {
  border-color: var(--accent-border);
  background: var(--accent-dim);
  box-shadow: 0 0 12px rgba(232,168,37,0.15);
}
.box.highlight .name { color: var(--accent); }
.box .step-num { display: none; }

.box.cat-page { border-left: 3px solid var(--blue); }
.box.cat-shared { border-left: 3px solid var(--teal); }
.box.cat-data { border-left: 3px solid var(--green); }
.box.cat-lib { border-left: 3px solid var(--violet); }
.box.cat-ext { border-left: 3px solid var(--text3); }
.box.cat-user { border-left: 3px solid var(--rose); }

.flows-panel {
  width: 360px; flex-shrink: 0;
  background: var(--s1);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.flows-hdr {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 700;
}
.flows-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.flow-item {
  padding: 10px 18px;
  cursor: pointer;
  transition: all .12s;
  border-left: 3px solid transparent;
}
.flow-item:hover { background: var(--s2); }
.flow-item.active {
  background: var(--accent-dim);
  border-left-color: var(--accent);
}
.flow-item .fl-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.flow-item.active .fl-name { color: var(--accent); }
.flow-item .fl-desc { font-size: 11px; color: var(--text3); line-height: 1.4; }
.flow-item.active .fl-desc { color: var(--text2); }

.clear-btn {
  display: inline-block;
  padding: 5px 12px; margin: 8px 18px;
  font-size: 11px; color: var(--text2);
  background: var(--s2); border: 1px solid var(--border);
  border-radius: 5px; cursor: pointer;
  font-family: var(--font); transition: all .12s;
}
.clear-btn:hover { border-color: var(--accent); color: var(--accent); }

.steps-panel {
  border-top: 1px solid var(--border);
  max-height: 320px; overflow-y: auto;
  padding: 12px 18px;
  display: none;
}
.steps-panel.visible { display: block; }
.steps-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); margin-bottom: 10px; }
.step-row { display: flex; gap: 10px; margin-bottom: 12px; }
.step-circle {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent); color: var(--bg);
  font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.step-body { flex: 1; }
.step-label { font-size: 12px; font-weight: 600; font-family: var(--mono); margin-bottom: 2px; }
.step-detail { font-size: 11px; color: var(--text2); line-height: 1.4; }
</style>
</head>
<body>
<div class="page">

<div class="hdr">
  <h1>CompanyHub - Architecture &amp; Flows</h1>
  <p>Every page, library, and data store that powers CompanyHub. Pick a flow on the right to highlight the path through the system and see what gets passed at each step.</p>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:var(--rose)"></div> User / Actor</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div> Page</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--teal)"></div> Shared Infrastructure</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div> Data Store</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--violet)"></div> Library</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--text3)"></div> External Service</div>
  </div>
</div>

<div class="body">
  <div class="diagram-wrap" id="diagramWrap">
    <div class="diagram" id="diagram"></div>
    <svg class="connectors" id="connectorSvg"></svg>
  </div>
  <div class="flows-panel">
    <div class="flows-hdr">FLOWS</div>
    <div class="flows-list" id="flowsList"></div>
    <div class="steps-panel" id="stepsPanel">
      <div class="steps-title">STEPS</div>
      <div id="stepsBody"></div>
    </div>
  </div>
</div>

</div>

function buildDiagram() {
  var d = document.getElementById('diagram');
  var html = '';
  for (var i = 0; i < 6; i++) {
    html += '<div class="col-label">' + COL_LABELS[i] + '</div>';
  }
  var cols = [[],[],[],[],[],[]];
  COMPONENTS.forEach(function(c) { cols[c.col].push(c); });
  var maxRows = 0;
  cols.forEach(function(col) { if (col.length > maxRows) maxRows = col.length; });
  for (var row = 0; row < maxRows; row++) {
    for (var col = 0; col < 6; col++) {
      var comp = cols[col][row];
      if (comp) {
        html += '<div class="box cat-' + comp.cat + '" id="box-' + comp.id + '">';
        html += '<div class="step-num" id="step-' + comp.id + '"></div>';
        html += '<div class="name">' + esc(comp.name) + '</div>';
        html += '<div class="detail">' + esc(comp.detail) + '</div>';
        html += '</div>';
      } else {
        html += '<div></div>';
      }
    }
  }
  d.innerHTML = html;
}

function buildFlowsList() {
  var list = document.getElementById('flowsList');
  var html = '';
  FLOWS.forEach(function(f) {
    html += '<div class="flow-item" data-flow="' + f.id + '" onclick="selectFlow(\'' + f.id + '\')">';
    html += '<div class="fl-name">' + esc(f.name) + '</div>';
    html += '<div class="fl-desc">' + esc(f.desc) + '</div>';
    html += '</div>';
  });
  html += '<button class="clear-btn" onclick="clearSelection()">Clear selection</button>';
  list.innerHTML = html;
}

function getBoxCenter(id) {
  var box = document.getElementById('box-' + id);
  var wrap = document.getElementById('diagramWrap');
  if (!box || !wrap) return null;
  var br = box.getBoundingClientRect();
  var wr = wrap.getBoundingClientRect();
  return {
    x: br.left - wr.left + wrap.scrollLeft + br.width / 2,
    y: br.top - wr.top + wrap.scrollTop + br.height / 2,
    right: br.left - wr.left + wrap.scrollLeft + br.width,
    left: br.left - wr.left + wrap.scrollLeft,
    top: br.top - wr.top + wrap.scrollTop,
    bottom: br.top - wr.top + wrap.scrollTop + br.height
  };
}

function drawConnectors(flow) {
  var svg = document.getElementById('connectorSvg');
  var wrap = document.getElementById('diagramWrap');
  var diagram = document.getElementById('diagram');
  var dr = diagram.getBoundingClientRect();
  svg.setAttribute('width', Math.max(dr.width, wrap.scrollWidth));
  svg.setAttribute('height', Math.max(dr.height + 40, wrap.scrollHeight));
  svg.innerHTML = '';

  flow.steps.forEach(function(s, i) {
    if (s.from === s.to) return;
    var a = getBoxCenter(s.from);
    var b = getBoxCenter(s.to);
    if (!a || !b) return;

    var x1, y1, x2, y2;
    if (Math.abs(a.x - b.x) > 40) {
      if (a.x < b.x) { x1 = a.right; x2 = b.left; }
      else { x1 = a.left; x2 = b.right; }
      y1 = a.y; y2 = b.y;
    } else {
      x1 = a.x; x2 = b.x;
      if (a.y < b.y) { y1 = a.bottom; y2 = b.top; }
      else { y1 = a.top; y2 = b.bottom; }
    }

    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    svg.appendChild(line);

    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circ.setAttribute('cx', mx); circ.setAttribute('cy', my); circ.setAttribute('r', 10);
    svg.appendChild(circ);

    var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', mx); txt.setAttribute('y', my);
    txt.textContent = i + 1;
    svg.appendChild(txt);
  });
}

function selectFlow(id) {
  var flow = FLOWS.find(function(f) { return f.id === id; });
  if (!flow) return;
  document.querySelectorAll('.flow-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-flow') === id);
  });
  document.querySelectorAll('.box').forEach(function(el) { el.classList.remove('highlight'); });
  document.querySelectorAll('.step-num').forEach(function(el) { el.classList.remove('visible'); el.textContent = ''; });

  flow.steps.forEach(function(s) {
    [s.from, s.to].forEach(function(cid) {
      var box = document.getElementById('box-' + cid);
      if (box) box.classList.add('highlight');
    });
  });

  drawConnectors(flow);

  var sp = document.getElementById('stepsPanel');
  var sb = document.getElementById('stepsBody');
  var html = '';
  flow.steps.forEach(function(s, i) {
    html += '<div class="step-row">';
    html += '<div class="step-circle">' + (i+1) + '</div>';
    html += '<div class="step-body">';
    html += '<div class="step-label">' + esc(s.from) + ' -&gt; ' + esc(s.to) + '</div>';
    html += '<div class="step-detail"><strong>' + esc(s.label) + '</strong></div>';
    html += '<div class="step-detail">' + esc(s.detail) + '</div>';
    html += '</div></div>';
  });
  sb.innerHTML = html;
  sp.classList.add('visible');
}

function clearSelection() {
  document.querySelectorAll('.flow-item').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.box').forEach(function(el) { el.classList.remove('highlight'); });
  document.querySelectorAll('.step-num').forEach(function(el) { el.classList.remove('visible'); });
  document.getElementById('stepsPanel').classList.remove('visible');
  document.getElementById('connectorSvg').innerHTML = '';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

buildDiagram();
buildFlowsList();
</script>
</body>
</html>
